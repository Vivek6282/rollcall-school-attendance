<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RollCall | Nature & School Sanctuary</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600;1,700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              forest: {
                50: '#f2f9f3',
                100: '#e1f2e4',
                200: '#c5e5cb',
                300: '#99d0a3',
                400: '#64b473',
                500: '#3e984f',
                600: '#2f7c3e',
                700: '#276233',
                800: '#234f2c',
                900: '#1e4226',
                950: '#0c2313',
              },
              leaf: {
                light: '#ecfccb',
                DEFAULT: '#84cc16',
                dark: '#4d7c0f'
              },
              bark: {
                50: '#fdf8f6',
                100: '#f2e8e5',
                200: '#eaddd7',
                700: '#78350f',
                800: '#582b14',
                900: '#381a08',
              },
              parchment: '#f7faf5'
            },
            fontFamily: {
              sans: ['Nunito', 'sans-serif'],
              serif: ['Playfair Display', 'serif']
            }
          }
        }
      }
    </script>
    <style>
      body { 
        font-family: 'Nunito', sans-serif; 
        background: radial-gradient(circle at 10% 20%, rgba(220, 252, 231, 0.4) 0%, rgba(247, 250, 245, 1) 90%);
      }
      @keyframes sway {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(3deg); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(4deg); }
      }
      .animate-sway {
        animation: sway 6s ease-in-out infinite;
        transform-origin: bottom center;
      }
      .animate-sway-slow {
        animation: sway 9s ease-in-out infinite reverse;
        transform-origin: bottom left;
      }
      .animate-float {
        animation: floatSlow 7s ease-in-out infinite;
      }
      /* Custom natural scrollbars */
      ::-webkit-scrollbar {
        width: 7px;
        height: 7px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f6ed;
      }
      ::-webkit-scrollbar-thumb {
        background: #a7d0b0;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #529864;
      }
    </style>
  </head>
  <body class="bg-parchment min-h-screen text-slate-800 antialiased selection:bg-forest-200 selection:text-forest-900">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
