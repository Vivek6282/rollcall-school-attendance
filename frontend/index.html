<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RollCall | Nature & School Attendance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              forest: {
                50: '#f0fdf4',
                100: '#dcfce7',
                200: '#bbf7d0',
                300: '#86efac',
                400: '#4ade80',
                500: '#22c55e',
                600: '#16a34a',
                700: '#15803d',
                800: '#166534',
                900: '#14532d',
                950: '#052e16',
              },
              moss: {
                DEFAULT: '#4d7c0f',
                dark: '#365314',
                light: '#a3e635'
              },
              sage: '#84a98c',
              earth: '#52796f',
              canopy: '#2f3e46'
            },
            fontFamily: {
              sans: ['Nunito', 'sans-serif'],
              serif: ['Playfair Display', 'serif']
            }
          }
        }
      }
    </script>
    <style>
      body { font-family: 'Nunito', sans-serif; }
      @keyframes sway {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(3deg); }
      }
      .animate-sway {
        animation: sway 6s ease-in-out infinite;
        transform-origin: bottom center;
      }
      .animate-sway-slow {
        animation: sway 9s ease-in-out infinite reverse;
        transform-origin: bottom left;
      }
    </style>
  </head>
  <body class="bg-[#f7f9f5] min-h-screen text-slate-800 antialiased selection:bg-forest-200 selection:text-forest-900">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
