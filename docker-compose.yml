services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rollcall}
      POSTGRES_USER: ${POSTGRES_USER:-rollcall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rollcall}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    restart: unless-stopped
    command: sh -c "python manage.py makemigrations core && python manage.py migrate && python manage.py seed && gunicorn config.wsgi -b 0.0.0.0:8000 -w 3"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rollcall}
      POSTGRES_USER: ${POSTGRES_USER:-rollcall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rollcall}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me}
      DEBUG: ${DEBUG:-0}
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - media:/media:ro
    depends_on:
      - backend
volumes:
  pgdata:
  media:
